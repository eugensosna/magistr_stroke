<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" font-family="Liberation Serif, Times New Roman, serif">
<defs><marker id="a" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse"><path d="M0,0 L12,5 L0,10 z" fill="black"/></marker></defs>
<rect width="1000" height="630" fill="white"/>
<!-- Браузер пацієнта -->
<rect x="10" y="10" width="980" height="245" fill="#f2f2f2" stroke="black" stroke-width="1.5"/>
<text x="20" y="34" font-size="17" font-style="italic">Браузер на пристрої пацієнта (Vue.js)</text>
<rect x="30" y="50" width="215" height="85" fill="white" stroke="black" stroke-width="2"/>
<text x="137" y="87" text-anchor="middle" font-size="18">Вебкамера</text>
<text x="137" y="110" text-anchor="middle" font-size="18">(getUserMedia)</text>
<rect x="275" y="50" width="215" height="85" fill="white" stroke="black" stroke-width="2"/>
<text x="382" y="87" text-anchor="middle" font-size="18">Вибір режиму</text>
<text x="382" y="110" text-anchor="middle" font-size="18">розпізнавання</text>
<rect x="520" y="50" width="215" height="85" fill="white" stroke="black" stroke-width="2"/>
<text x="627" y="87" text-anchor="middle" font-size="18">MediaPipe Hand</text>
<text x="627" y="110" text-anchor="middle" font-size="18">Landmarker (WASM)</text>
<rect x="765" y="50" width="215" height="85" fill="white" stroke="black" stroke-width="2"/>
<text x="872" y="87" text-anchor="middle" font-size="18">Показники руху,</text>
<text x="872" y="110" text-anchor="middle" font-size="18">ігри (Canvas 2D)</text>
<rect x="520" y="160" width="215" height="75" fill="white" stroke="black" stroke-width="2" stroke-dasharray="8 5"/>
<text x="627" y="192" text-anchor="middle" font-size="18">Передавання кадру</text>
<text x="627" y="215" text-anchor="middle" font-size="18">(JPEG або WebP)</text>
<line x1="245" y1="92" x2="275" y2="92" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="92" x2="520" y2="92" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<line x1="735" y1="92" x2="765" y2="92" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<path d="M382,135 V197 H520" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#a)"/>
<path d="M735,197 H872 V135" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#a)"/>
<text x="760" y="222" font-size="17" font-style="italic">координати точок</text>
<!-- Сервер -->
<rect x="10" y="335" width="980" height="145" fill="#f2f2f2" stroke="black" stroke-width="1.5"/>
<text x="20" y="359" font-size="17" font-style="italic">Сервер (Spring Boot)</text>
<rect x="30" y="365" width="215" height="95" fill="white" stroke="black" stroke-width="2"/>
<text x="137" y="406" text-anchor="middle" font-size="18">Spring Security:</text>
<text x="137" y="429" text-anchor="middle" font-size="18">автентифікація</text>
<rect x="275" y="365" width="215" height="95" fill="white" stroke="black" stroke-width="2"/>
<text x="382" y="406" text-anchor="middle" font-size="18">REST-контролери:</text>
<text x="382" y="429" text-anchor="middle" font-size="18">сеанси, звіти</text>
<rect x="520" y="365" width="215" height="95" fill="white" stroke="black" stroke-width="2"/>
<text x="627" y="406" text-anchor="middle" font-size="18">WebSocket-шлюз:</text>
<text x="627" y="429" text-anchor="middle" font-size="18">обмеження частоти</text>
<rect x="765" y="365" width="215" height="95" fill="white" stroke="black" stroke-width="2"/>
<text x="872" y="406" text-anchor="middle" font-size="18">Spring Data JPA:</text>
<text x="872" y="429" text-anchor="middle" font-size="18">журнал сеансів</text>
<!-- Нижній рівень -->
<rect x="30" y="540" width="215" height="75" fill="white" stroke="black" stroke-width="2"/>
<text x="137" y="572" text-anchor="middle" font-size="18">Кабінет фахівця</text>
<text x="137" y="595" text-anchor="middle" font-size="18">(Vue.js, браузер)</text>
<line x1="137" y1="540" x2="137" y2="460" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="147" y="507" font-size="17" font-style="italic">REST (JSON)</text>
<rect x="520" y="540" width="215" height="75" fill="white" stroke="black" stroke-width="2" stroke-dasharray="8 5"/>
<text x="627" y="572" text-anchor="middle" font-size="18">Сервіс розпізнавання</text>
<text x="627" y="595" text-anchor="middle" font-size="18">(Python, MediaPipe)</text>
<line x1="627" y1="460" x2="627" y2="540" stroke="black" stroke-width="2" stroke-dasharray="8 5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="640" y="507" font-size="17" font-style="italic">gRPC</text>
<rect x="765" y="540" width="215" height="75" fill="white" stroke="black" stroke-width="2"/>
<text x="872" y="572" text-anchor="middle" font-size="18">PostgreSQL:</text>
<text x="872" y="595" text-anchor="middle" font-size="18">сеанси, показники</text>
<line x1="872" y1="460" x2="872" y2="540" stroke="black" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<!-- Зв'язки браузер - сервер -->
<line x1="382" y1="255" x2="382" y2="365" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="315" text-anchor="end" font-size="17" font-style="italic">REST (JSON): показники вправ</text>
<line x1="627" y1="235" x2="627" y2="365" stroke="black" stroke-width="2" stroke-dasharray="8 5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="640" y="305" font-size="17" font-style="italic">WebSocket (wss): кадри,</text>
<text x="640" y="326" font-size="17" font-style="italic">координати точок</text>
<!-- Умовні позначення -->
<line x1="275" y1="560" x2="325" y2="560" stroke="black" stroke-width="2" stroke-dasharray="8 5"/>
<text x="335" y="566" font-size="17">резервний режим</text>
<line x1="275" y1="595" x2="325" y2="595" stroke="black" stroke-width="2"/>
<text x="335" y="601" font-size="17">основний режим</text>
</svg>
