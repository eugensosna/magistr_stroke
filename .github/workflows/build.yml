# Збирає DOCX при кожному push і зберігає його як артефакт збірки.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docx:
    runs-on: ubuntu-latest
    container: docker.io/asciidoctor/docker-asciidoctor:latest
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache pandoc-cli python3
      - run: python3 tools/check.py
      - run: sh tools/build.sh thesis.adoc
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-docx
          path: build/thesis.docx
