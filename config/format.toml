# Параметри оформлення роботи.
#
# Значення за замовчуванням відповідають ДСТУ 3008:2015 та типовим вимогам
# до кваліфікаційних (магістерських) робіт, що спираються на Наказ МОН № 40
# від 12.01.2017. Перед здачею звірте їх з методичними рекомендаціями своєї
# кафедри: поля, шрифт та інтервал зазвичай уточнює саме кафедра.

[page]
# Формат А4, розміри в міліметрах
width_mm  = 210
height_mm = 297
# Поля (ДСТУ 3008:2015: ліве не менше 25–30 мм, праве не менше 10 мм,
# верхнє і нижнє не менше 20 мм)
margin_left_mm   = 30
margin_right_mm  = 15
margin_top_mm    = 20
margin_bottom_mm = 20
# Відстань від краю аркуша до колонтитула з номером сторінки
header_mm = 10
# Нумерація сторінок: арабські цифри, у правому верхньому куті, на титульному
# аркуші номер не ставиться, але він враховується.
page_number_align = "right"     # right | center
page_number_position = "header" # header | footer

[text]
font = "Times New Roman"
size_pt = 14
line_spacing = 1.5            # міжрядковий інтервал
first_line_indent_cm = 1.25   # абзацний відступ
language = "uk-UA"
hyphenation = false           # автоматичне перенесення слів

[headings]
# Заголовки розділів і структурних елементів (ВСТУП, ВИСНОВКИ, ...)
# друкуються великими літерами, жирним, по центру, з нової сторінки.
chapter_size_pt = 14
chapter_space_after_pt = 21   # ~ один порожній рядок при 14 пт і інтервалі 1,5
# Підрозділи і пункти: з абзацного відступу, жирним, звичайними літерами.
section_size_pt = 14
section_space_before_pt = 21
section_space_after_pt = 21

[tables]
size_pt = 12                  # текст у таблицях
line_spacing = 1.0

[code]
font = "Courier New"
size_pt = 12
line_spacing = 1.0

[footnotes]
size_pt = 12
